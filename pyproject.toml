[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "garmin-mcp"
version = "0.2.2"
description = "MCP server (streamable HTTP) exposing a personal Garmin Connect account"
readme = "README.md"
requires-python = ">=3.12"
license = "0BSD"
license-files = ["LICENSE"]
dependencies = [
    "garminconnect>=0.3.20,<0.4",
    "mcp>=2.3,<3",
    "uvicorn>=0.30",
]

[project.scripts]
garmin-mcp = "garmin_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
anyio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
